<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>สรุปสถิติมาเรียน</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>สรุปสถิติมาเรียน</h1><small>โรงเรียนวัดปรีดาราม (มณีศิริวรรณ)</small></header>
<div id="nav"></div>
<main>
  <div class="card">
    <div class="inline"><label for="date" style="margin:0">วันที่</label><input id="date" type="date"></div>
    <div class="export">
      <button id="xlsDay" type="button" class="secondary" title="ดาวน์โหลดสรุปของวันที่เลือกเป็นไฟล์ Excel">📥 Excel รายวัน</button>
      <button id="xlsMonth" type="button" class="secondary" title="ดาวน์โหลดทุกวันในเดือนของวันที่เลือก (1 แผ่นงานต่อวัน)">📥 Excel ทั้งเดือน</button>
    </div>
    <p id="lineHint" class="muted" hidden>ในแอป LINE อาจดาวน์โหลดไฟล์ไม่ได้ ·
      <a id="openExt" href="#">เปิดหน้านี้ในเบราว์เซอร์</a></p>
    <h2 id="title" style="font-size:1.05rem"></h2>
    <div class="scroll"><table class="att">
      <thead>
        <tr><th rowspan="2">ชั้น</th><th colspan="3" class="gs">เต็ม</th><th colspan="3" class="gs present">มา</th>
          <th colspan="3" class="gs absent">ขาด</th><th rowspan="2" class="gs">%</th></tr>
        <tr><th class="gs">ชาย</th><th>หญิง</th><th>รวม</th><th class="gs">ชาย</th><th>หญิง</th><th>รวม</th>
          <th class="gs">ชาย</th><th>หญิง</th><th>รวม</th></tr>
      </thead>
      <tbody id="body"></tbody><tfoot id="foot"></tfoot>
    </table></div>
    <p class="muted" id="note"></p>
  </div>
</main>
<script type="module">
import { sb, $, esc, nav, toast, fmtDate } from "./common.js";
import { buildWorkbook, download, fileNameDay, fileNameMonth, loadExcelJS } from "./export.js";
$("#nav").innerHTML = nav("summary");
let shown = null; // { date, rows } currently on screen, for the Excel export

// เต็ม / มา / ขาด แยกชาย-หญิง (คิดจากชั้นที่ลงแล้วเท่านั้น)
function agg(rows) {
  const sum = (k) => rows.reduce((s, r) => s + (Number(r[k]) || 0), 0);
  const tm = sum("total_male"), tf = sum("total_female"), mp = sum("male_present"), fp = sum("female_present");
  const total = tm + tf, present = mp + fp;
  return { tm, tf, total, mp, fp, ma: tm - mp, fa: tf - fp, present, absent: total - present,
    pct: total ? (100 * present / total).toFixed(1) : "-" };
}
const cells = (a) =>
  `<td class="gs">${a.tm}</td><td>${a.tf}</td><td class="tot-t">${a.total}</td>` +
  `<td class="gs">${a.mp}</td><td>${a.fp}</td><td class="tot-p">${a.present}</td>` +
  `<td class="gs">${a.ma}</td><td>${a.fa}</td><td class="tot-a">${a.absent}</td>` +
  `<td class="gs">${a.pct}</td>`;

async function load() {
  const date = $("#date").value || null;
  const { data, error } = await sb.rpc("daily_summary", { p_date: date });
  if (error) return toast("โหลดข้อมูลไม่สำเร็จ", false);
  if (!$("#date").value) {
    const { data: t } = await sb.rpc("th_today"); $("#date").value = t;
  }
  $("#title").textContent = fmtDate($("#date").value);
  shown = { date: $("#date").value, rows: data };
  const done = data.filter((r) => r.submitted);
  $("#body").innerHTML = data.map((r) => r.submitted
    ? `<tr><td>${esc(r.name)}</td>${cells(agg([r]))}</tr>`
    : `<tr><td>${esc(r.name)}</td><td class="gs">${r.total_male}</td><td>${r.total_female}</td>` +
      `<td class="tot-t">${(Number(r.total_male) || 0) + (Number(r.total_female) || 0)}</td>` +
      `<td colspan="7" class="gs pending">ยังไม่ลง</td></tr>`).join("");
  const isKg = (r) => r.name.startsWith("อ."), isPri = (r) => r.name.startsWith("ป.");
  $("#foot").innerHTML =
    `<tr class="kg"><td>รวมอนุบาล</td>${cells(agg(done.filter(isKg)))}</tr>` +
    `<tr class="pri"><td>รวมประถม</td>${cells(agg(done.filter(isPri)))}</tr>` +
    `<tr class="grand"><td>รวมทั้งหมด</td>${cells(agg(done))}</tr>`;
  $("#note").textContent = `รวมเฉพาะชั้นที่ลงแล้ว ${done.length}/${data.length} ชั้น`;
}
$("#date").addEventListener("change", load);
load();

// ---- Excel export (ExcelJS loads on first use)
async function exportXlsx(btn, make) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = "กำลังสร้างไฟล์…";
  try {
    const ExcelJS = await loadExcelJS();
    const { days, name } = await make();
    if (!days.length) return toast("ยังไม่มีข้อมูลที่ลงไว้ในเดือนนี้", false);
    await download(buildWorkbook(ExcelJS, days), name);
  } catch (e) {
    console.error(e);
    toast(e.message || "สร้างไฟล์ไม่สำเร็จ", false);
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

// Every day of the selected month that has at least one class submitted (one sheet per day).
async function monthDays(anyDate) {
  const [y, m] = anyDate.split("-").map(Number);
  const n = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const dates = Array.from({ length: n }, (_, i) => `${anyDate.slice(0, 7)}-${String(i + 1).padStart(2, "0")}`);
  const res = await Promise.all(dates.map((d) => sb.rpc("daily_summary", { p_date: d })));
  if (res.some((x) => x.error)) throw new Error("โหลดข้อมูลไม่สำเร็จ");
  return dates.map((date, i) => ({ date, rows: res[i].data })).filter((d) => d.rows.some((r) => r.submitted));
}

const dayBtn = $("#xlsDay"), monthBtn = $("#xlsMonth");
dayBtn.addEventListener("click", () => exportXlsx(dayBtn, async () =>
  ({ days: shown ? [shown] : [], name: fileNameDay(shown.date) })));
monthBtn.addEventListener("click", () => exportXlsx(monthBtn, async () =>
  ({ days: await monthDays($("#date").value), name: fileNameMonth($("#date").value) })));

// LINE's in-app browser often can't save downloads; offer to reopen in the phone's browser.
if (/\bLine\//i.test(navigator.userAgent)) {
  const u = new URL(location.href);
  u.searchParams.set("openExternalBrowser", "1");
  $("#openExt").href = u.toString();
  $("#lineHint").hidden = false;
}
</script>
</body>
</html>
