name: Deploy Supabase (migrations + functions)
on:
  push:
    branches: [main]
    paths: [supabase/**, .github/workflows/supabase.yml]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_REF"
      # The init migration was first applied by hand in the SQL Editor, so mark it
      # as applied in the migration history (no-op once recorded).
      - run: supabase migration repair --status applied 20261101000000
      - run: supabase db push --linked --yes
      - run: supabase functions deploy submit-attendance --no-verify-jwt
      - run: supabase functions deploy line-webhook --no-verify-jwt
